[workspace]
members = ["crates/anagram-core", "crates/anagram-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
unicode-normalization = "0.1.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep routine test builds small. Use an explicit profile override when symbols
# or incremental compilation are needed for a debugging session.
[profile.dev]
debug = 0
incremental = false
