name: apply phrase benchmarking

on:
  push:
    branches:
      - feature/phrase-benchmarking

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Apply benchmark changes
        run: python scripts/apply_phrase_benchmarking.py
      - name: Validate
        run: |
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "Grzegorz Kaczmarski"
          git config user.email "tajemniktv@outlook.com"
          git add anagram_benchmark.py tests/test_phrase_benchmarking.py
          git commit -m "Add phrase-aware benchmark A/B"
          git push
