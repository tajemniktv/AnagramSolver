name: apply Cubic review fixes

on:
  push:
    branches: [feature/phrase-benchmarking]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phrase-benchmarking
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Apply review fixes
        run: python scripts/apply_cubic_review_fixes.py

      - name: Validate
        run: |
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Remove temporary maintenance files
        run: |
          rm scripts/apply_cubic_review_fixes.py
          rm .github/workflows/apply-cubic-review-fixes.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address Cubic benchmark review findings"
          git push origin HEAD:feature/phrase-benchmarking
