name: apply PR 4 fixes

on:
  push:
    branches:
      - feature/diversified-phrase-rescore
    paths:
      - .github/scripts/apply_pr4_review_fixes.py
      - .github/workflows/apply-pr4-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/diversified-phrase-rescore
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # This workflow is temporary and deletes itself after a green validation.
      - name: Apply fixes
        run: python .github/scripts/apply_pr4_review_fixes.py

      - name: Compile
        run: python -m py_compile *.py tests/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Diff check
        run: git diff --check

      - name: Commit validated fixes and remove staging files
        shell: bash
        run: |
          rm -f .github/workflows/apply-pr4-fixes.yml
          rm -f .github/scripts/apply_pr4_review_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix diversified corpus shortlist reviews"
          git push origin HEAD:feature/diversified-phrase-rescore
