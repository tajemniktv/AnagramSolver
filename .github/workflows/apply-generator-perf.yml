name: apply generator performance fixes

on:
  push:
    branches: [feature/user-friendly-cli]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/user-friendly-cli
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Apply generator performance patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path("anagram_generate.py")
          text = generator.read_text(encoding="utf-8")
          text = text.replace(
              "import argparse\nimport math\nimport re\nimport sys\nimport unicodedata\nimport urllib.request\n",
              "import argparse\nimport concurrent.futures\nimport math\nimport multiprocessing\nimport os\nimport re\nimport sys\nimport time\nimport unicodedata\nimport urllib.request\n",
          )

          start = text.index("def solve(\n")
          end = text.index("\ndef morph_root", start)
          replacement = r'''_WORKER_CANDIDATES: tuple[Candidate, ...] = ()
          _WORKER_BY_SIGNATURE: dict[tuple[int, ...], tuple[int, ...]] = {}
          _WORKER_REMAINING: tuple[int, ...] = ()
          _WORKER_ALLOW_REPEAT = True
          _WORKER_REQUIRED_ANY: frozenset[str] = frozenset()
          _WORKER_HINT_INDICES: tuple[int, ...] = ()
          _WORKER_MIN_LEN = 0
          _WORKER_MAX_LEN = 0
          _WORKER_INITIAL_MATCHED = False
          _WORKER_STOP = None


          def resolve_worker_count(requested: int) -> int:
              """Resolve 0=auto to a conservative process count."""
              if requested > 0:
                  return requested
              return max(1, min(8, os.cpu_count() or 1))


          def _hint_possible(
              remaining: tuple[int, ...],
              start: int,
              candidates: Sequence[Candidate],
              hint_indices: Sequence[int],
          ) -> bool:
              return any(
                  i >= start and fits(candidates[i].sig, remaining)
                  for i in hint_indices
              )


          def _solve_sequential(
              remaining: tuple[int, ...],
              candidates: Sequence[Candidate],
              min_words: int,
              max_words: int,
              max_results: int,
              allow_repeat: bool,
              required_any: frozenset[str],
              initial_any_matched: bool,
          ) -> Iterator[tuple[str, ...]]:
              by_signature: dict[tuple[int, ...], list[int]] = defaultdict(list)
              for i, c in enumerate(candidates):
                  by_signature[c.sig].append(i)

              if not candidates:
                  return

              hint_indices = tuple(
                  i for i, c in enumerate(candidates) if c.word in required_any
              )
              results_found = 0
              dead: set[tuple[tuple[int, ...], int, int, bool]] = set()
              min_candidate_len = min(c.length for c in candidates)
              max_candidate_len = max(c.length for c in candidates)

              def dfs(
                  rem: tuple[int, ...],
                  start: int,
                  words_left: int,
                  chosen: list[str],
                  hint_matched: bool,
              ) -> Iterator[tuple[str, ...]]:
                  nonlocal results_found

                  if max_results > 0 and results_found >= max_results:
                      return

                  rem_len = sum(rem)
                  if words_left == 0:
                      if rem_len == 0 and (not required_any or hint_matched):
                          results_found += 1
                          yield tuple(chosen)
                      return
                  if rem_len == 0:
                      return
                  if rem_len < words_left * min_candidate_len:
                      return
                  if rem_len > words_left * max_candidate_len:
                      return
                  if (
                      required_any
                      and not hint_matched
                      and not _hint_possible(rem, start, candidates, hint_indices)
                  ):
                      return

                  state = (rem, start, words_left, hint_matched)
                  if state in dead:
                      return

                  before = results_found

                  if words_left == 1:
                      for i in by_signature.get(rem, []):
                          if i < start:
                              continue
                          word = candidates[i].word
                          if required_any and not (hint_matched or word in required_any):
                              continue
                          results_found += 1
                          yield tuple(chosen + [word])
                          if max_results > 0 and results_found >= max_results:
                              return
                      if results_found == before:
                          dead.add(state)
                      return

                  min_this_len = max(
                      min_candidate_len,
                      rem_len - (words_left - 1) * max_candidate_len,
                  )
                  max_this_len = min(
                      max_candidate_len,
                      rem_len - (words_left - 1) * min_candidate_len,
                  )

                  for i in range(start, len(candidates)):
                      c = candidates[i]
                      if c.length < min_this_len or c.length > max_this_len:
                          continue
                      if not fits(c.sig, rem):
                          continue
                      new_rem = tuple(r - w for r, w in zip(rem, c.sig))
                      next_start = i if allow_repeat else i + 1
                      yield from dfs(
                          new_rem,
                          next_start,
                          words_left - 1,
                          chosen + [c.word],
                          hint_matched or c.word in required_any,
                      )
                      if max_results > 0 and results_found >= max_results:
                          return

                  if results_found == before:
                      dead.add(state)

              for nwords in range(min_words, max_words + 1):
                  yield from dfs(
                      remaining,
                      0,
                      nwords,
                      [],
                      initial_any_matched,
                  )
                  if max_results > 0 and results_found >= max_results:
                      break


          def _init_parallel_worker(
              candidates: tuple[Candidate, ...],
              remaining: tuple[int, ...],
              allow_repeat: bool,
              required_any: frozenset[str],
              initial_any_matched: bool,
              stop_flag,
          ) -> None:
              global _WORKER_CANDIDATES
              global _WORKER_BY_SIGNATURE
              global _WORKER_REMAINING
              global _WORKER_ALLOW_REPEAT
              global _WORKER_REQUIRED_ANY
              global _WORKER_HINT_INDICES
              global _WORKER_MIN_LEN
              global _WORKER_MAX_LEN
              global _WORKER_INITIAL_MATCHED
              global _WORKER_STOP

              _WORKER_CANDIDATES = candidates
              grouped: dict[tuple[int, ...], list[int]] = defaultdict(list)
              for i, candidate in enumerate(candidates):
                  grouped[candidate.sig].append(i)
              _WORKER_BY_SIGNATURE = {
                  signature: tuple(indices)
                  for signature, indices in grouped.items()
              }
              _WORKER_REMAINING = remaining
              _WORKER_ALLOW_REPEAT = allow_repeat
              _WORKER_REQUIRED_ANY = required_any
              _WORKER_HINT_INDICES = tuple(
                  i for i, candidate in enumerate(candidates)
                  if candidate.word in required_any
              )
              _WORKER_MIN_LEN = min(c.length for c in candidates)
              _WORKER_MAX_LEN = max(c.length for c in candidates)
              _WORKER_INITIAL_MATCHED = initial_any_matched
              _WORKER_STOP = stop_flag


          def _worker_should_stop() -> bool:
              return bool(_WORKER_STOP is not None and _WORKER_STOP.value)


          def _solve_parallel_branch(
              task: tuple[int, int, int],
          ) -> list[tuple[str, ...]]:
              nwords, first_index, branch_limit = task
              if _worker_should_stop():
                  return []

              first = _WORKER_CANDIDATES[first_index]
              if not fits(first.sig, _WORKER_REMAINING):
                  return []

              remaining = tuple(
                  r - w for r, w in zip(_WORKER_REMAINING, first.sig)
              )
              start = first_index if _WORKER_ALLOW_REPEAT else first_index + 1
              output: list[tuple[str, ...]] = []
              dead: set[tuple[tuple[int, ...], int, int, bool]] = set()

              def dfs(
                  rem: tuple[int, ...],
                  current_start: int,
                  words_left: int,
                  chosen: list[str],
                  hint_matched: bool,
              ) -> None:
                  if _worker_should_stop():
                      return
                  if branch_limit > 0 and len(output) >= branch_limit:
                      return

                  rem_len = sum(rem)
                  if words_left == 0:
                      if rem_len == 0 and (
                          not _WORKER_REQUIRED_ANY or hint_matched
                      ):
                          output.append(tuple(chosen))
                      return
                  if rem_len == 0:
                      return
                  if rem_len < words_left * _WORKER_MIN_LEN:
                      return
                  if rem_len > words_left * _WORKER_MAX_LEN:
                      return
                  if (
                      _WORKER_REQUIRED_ANY
                      and not hint_matched
                      and not _hint_possible(
                          rem,
                          current_start,
                          _WORKER_CANDIDATES,
                          _WORKER_HINT_INDICES,
                      )
                  ):
                      return

                  state = (rem, current_start, words_left, hint_matched)
                  if state in dead:
                      return
                  before = len(output)

                  if words_left == 1:
                      for i in _WORKER_BY_SIGNATURE.get(rem, ()):
                          if i < current_start:
                              continue
                          word = _WORKER_CANDIDATES[i].word
                          if _WORKER_REQUIRED_ANY and not (
                              hint_matched or word in _WORKER_REQUIRED_ANY
                          ):
                              continue
                          output.append(tuple(chosen + [word]))
                          if branch_limit > 0 and len(output) >= branch_limit:
                              return
                      if len(output) == before:
                          dead.add(state)
                      return

                  min_this_len = max(
                      _WORKER_MIN_LEN,
                      rem_len - (words_left - 1) * _WORKER_MAX_LEN,
                  )
                  max_this_len = min(
                      _WORKER_MAX_LEN,
                      rem_len - (words_left - 1) * _WORKER_MIN_LEN,
                  )
                  for i in range(current_start, len(_WORKER_CANDIDATES)):
                      if _worker_should_stop():
                          return
                      candidate = _WORKER_CANDIDATES[i]
                      if candidate.length < min_this_len or candidate.length > max_this_len:
                          continue
                      if not fits(candidate.sig, rem):
                          continue
                      new_rem = tuple(r - w for r, w in zip(rem, candidate.sig))
                      next_start = i if _WORKER_ALLOW_REPEAT else i + 1
                      dfs(
                          new_rem,
                          next_start,
                          words_left - 1,
                          chosen + [candidate.word],
                          hint_matched or candidate.word in _WORKER_REQUIRED_ANY,
                      )
                      if branch_limit > 0 and len(output) >= branch_limit:
                          return
                  if len(output) == before:
                      dead.add(state)

              dfs(
                  remaining,
                  start,
                  nwords - 1,
                  [first.word],
                  _WORKER_INITIAL_MATCHED or first.word in _WORKER_REQUIRED_ANY,
              )
              return output


          def _parallel_tasks(
              remaining: tuple[int, ...],
              candidates: Sequence[Candidate],
              min_words: int,
              max_words: int,
              max_results: int,
          ) -> list[tuple[int, int, int]]:
              min_candidate_len = min(c.length for c in candidates)
              max_candidate_len = max(c.length for c in candidates)
              rem_len = sum(remaining)
              tasks: list[tuple[int, int, int]] = []
              for nwords in range(min_words, max_words + 1):
                  min_this_len = max(
                      min_candidate_len,
                      rem_len - (nwords - 1) * max_candidate_len,
                  )
                  max_this_len = min(
                      max_candidate_len,
                      rem_len - (nwords - 1) * min_candidate_len,
                  )
                  for i, candidate in enumerate(candidates):
                      if candidate.length < min_this_len or candidate.length > max_this_len:
                          continue
                      if fits(candidate.sig, remaining):
                          tasks.append((nwords, i, max_results))
              return tasks


          def _solve_parallel(
              remaining: tuple[int, ...],
              candidates: Sequence[Candidate],
              min_words: int,
              max_words: int,
              max_results: int,
              allow_repeat: bool,
              workers: int,
              required_any: frozenset[str],
              initial_any_matched: bool,
          ) -> Iterator[tuple[str, ...]]:
              tasks = _parallel_tasks(
                  remaining,
                  candidates,
                  min_words,
                  max_words,
                  max_results,
              )
              if len(tasks) < 2:
                  yield from _solve_sequential(
                      remaining,
                      candidates,
                      min_words,
                      max_words,
                      max_results,
                      allow_repeat,
                      required_any,
                      initial_any_matched,
                  )
                  return

              context = multiprocessing.get_context(
                  "spawn" if os.name == "nt" else "fork"
              )
              stop_flag = context.Value("b", False, lock=False)
              executor = concurrent.futures.ProcessPoolExecutor(
                  max_workers=workers,
                  mp_context=context,
                  initializer=_init_parallel_worker,
                  initargs=(
                      tuple(candidates),
                      remaining,
                      allow_repeat,
                      required_any,
                      initial_any_matched,
                      stop_flag,
                  ),
              )
              results_found = 0
              window = max(workers * 2, 2)
              futures: dict[int, concurrent.futures.Future[list[tuple[str, ...]]]] = {}
              next_submit = 0
              next_consume = 0

              try:
                  while next_consume < len(tasks):
                      while (
                          next_submit < len(tasks)
                          and next_submit - next_consume < window
                      ):
                          futures[next_submit] = executor.submit(
                              _solve_parallel_branch,
                              tasks[next_submit],
                          )
                          next_submit += 1

                      branch_results = futures.pop(next_consume).result()
                      next_consume += 1
                      for solution in branch_results:
                          yield solution
                          results_found += 1
                          if max_results > 0 and results_found >= max_results:
                              stop_flag.value = True
                              return
              finally:
                  stop_flag.value = True
                  executor.shutdown(wait=True, cancel_futures=True)


          def solve(
              remaining: tuple[int, ...],
              candidates: list[Candidate],
              min_words: int,
              max_words: int,
              max_results: int,
              allow_repeat: bool,
              workers: int = 1,
              required_any: Iterable[str] | None = None,
              initial_any_matched: bool = False,
          ) -> Iterator[tuple[str, ...]]:
              """Enumerate exact canonical word bags, optionally in parallel.

              Parallel mode partitions the original DFS by its first-word branch,
              then consumes branch results in the original deterministic order.
              This preserves exhaustive completeness and the same bounded-search
              prefix while allowing independent branches to use multiple cores.
              """
              if not candidates:
                  return
              required = frozenset(required_any or ())
              if workers <= 1 or len(candidates) < 32:
                  yield from _solve_sequential(
                      remaining,
                      candidates,
                      min_words,
                      max_words,
                      max_results,
                      allow_repeat,
                      required,
                      initial_any_matched,
                  )
                  return
              yield from _solve_parallel(
                  remaining,
                  candidates,
                  min_words,
                  max_words,
                  max_results,
                  allow_repeat,
                  workers,
                  required,
                  initial_any_matched,
              )
          '''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines())
          text = text[:start] + replacement + text[end:]

          parser_anchor = '    p.add_argument("--no-repeat", action="store_true")\n'
          if parser_anchor not in text:
              raise SystemExit("generator parser anchor not found")
          text = text.replace(
              parser_anchor,
              parser_anchor
              + '    p.add_argument(\n'
              + '        "--workers", type=int, default=0, metavar="N",\n'
              + '        help="Generation worker processes; 0 chooses automatically",\n'
              + '    )\n',
              1,
          )

          validation_anchor = '    if args.max_results < 0:\n        raise SystemExit("--max-results must be >= 0")\n'
          if validation_anchor not in text:
              raise SystemExit("generator validation anchor not found")
          text = text.replace(
              validation_anchor,
              validation_anchor
              + '    if args.workers < 0:\n        raise SystemExit("--workers must be >= 0")\n',
              1,
          )

          solve_anchor = '''    solutions: list[tuple[str, ...]] = []
              generated = 0
              accepted = 0
              try:
                  for solution in solve(
                      remaining,
                      candidates,
                      args.min_words,
                      args.max_words,
                      args.max_results,
                      allow_repeat=not args.no_repeat,
                  ):
          '''
          solve_anchor = "\n".join(line[14:] if line.startswith("              ") else line for line in solve_anchor.splitlines()) + "\n"
          if solve_anchor not in text:
              raise SystemExit("generator solve call anchor not found")
          solve_replacement = '''    solutions: list[tuple[str, ...]] = []
              generated = 0
              accepted = 0
              worker_count = resolve_worker_count(args.workers)
              search_started = time.perf_counter()
              try:
                  for solution in solve(
                      remaining,
                      candidates,
                      args.min_words,
                      args.max_words,
                      args.max_results,
                      allow_repeat=not args.no_repeat,
                      workers=worker_count,
                      required_any=contains_any,
                      initial_any_matched=bool(contains_any.intersection(required_words)),
                  ):
          '''
          solve_replacement = "\n".join(line[14:] if line.startswith("              ") else line for line in solve_replacement.splitlines()) + "\n"
          text = text.replace(solve_anchor, solve_replacement, 1)

          generated_anchor = '''    print(
                  f"Generated {generated:,} exact word set(s); "
                  f"{accepted:,} survived clue constraints.",
                  file=sys.stderr,
              )
          '''
          generated_anchor = "\n".join(line[14:] if line.startswith("              ") else line for line in generated_anchor.splitlines()) + "\n"
          if generated_anchor not in text:
              raise SystemExit("generator generated-summary anchor not found")
          generated_replacement = '''    search_seconds = time.perf_counter() - search_started
              print(
                  f"Generated {generated:,} exact word set(s); "
                  f"{accepted:,} survived clue constraints. "
                  f"Search {search_seconds:.2f}s using {worker_count} worker(s).",
                  file=sys.stderr,
              )
          '''
          generated_replacement = "\n".join(line[14:] if line.startswith("              ") else line for line in generated_replacement.splitlines()) + "\n"
          text = text.replace(generated_anchor, generated_replacement, 1)
          generator.write_text(text, encoding="utf-8")

          frontend = Path("anagram_solver.py")
          text = frontend.read_text(encoding="utf-8")
          text = text.replace("import subprocess\nimport sys\n", "import subprocess\nimport sys\nimport time\n", 1)
          cmd_anchor = '        "--top-per-group", "1",\n        "--export", str(output),\n'
          if cmd_anchor not in text:
              raise SystemExit("frontend generator command anchor not found")
          text = text.replace(
              cmd_anchor,
              '        "--top-per-group", "1",\n        "--workers", str(args.workers),\n        "--export", str(output),\n',
              1,
          )
          text = text.replace(
              'parser.add_argument("--workers", type=int, default=0, metavar="N", help="Reranker workers; 0 chooses automatically")',
              'parser.add_argument("--workers", type=int, default=0, metavar="N", help="Generator/reranker workers; 0 chooses automatically")',
              1,
          )
          old_generate = '''def _generate_candidates(args: argparse.Namespace, candidates: Path) -> None:
              """Generate privately, publishing the shared cache only on success."""
              temporary = candidates.with_name(
                  f".{candidates.name}.{uuid.uuid4().hex}.tmp"
              )
              try:
                  _run(build_generator_command(args, temporary), verbose=args.verbose)
                  if not temporary.is_file():
                      raise SystemExit(
                          f"Generator completed without writing its candidate export: {temporary}"
                      )
                  temporary.replace(candidates)
              finally:
                  temporary.unlink(missing_ok=True)
          '''
          old_generate = "\n".join(line[14:] if line.startswith("              ") else line for line in old_generate.splitlines())
          new_generate = '''def _generate_candidates(args: argparse.Namespace, candidates: Path) -> float:
              """Generate privately, publishing the shared cache only on success."""
              temporary = candidates.with_name(
                  f".{candidates.name}.{uuid.uuid4().hex}.tmp"
              )
              started = time.perf_counter()
              try:
                  _run(build_generator_command(args, temporary), verbose=args.verbose)
                  if not temporary.is_file():
                      raise SystemExit(
                          f"Generator completed without writing its candidate export: {temporary}"
                      )
                  temporary.replace(candidates)
                  return time.perf_counter() - started
              finally:
                  temporary.unlink(missing_ok=True)
          '''
          new_generate = "\n".join(line[14:] if line.startswith("              ") else line for line in new_generate.splitlines())
          if old_generate not in text:
              raise SystemExit("frontend generation function anchor not found")
          text = text.replace(old_generate, new_generate, 1)
          text = text.replace(
              '        _generate_candidates(args, candidates)\n    elif not args.json:\n',
              '        generation_seconds = _generate_candidates(args, candidates)\n'
              '        if not args.json:\n'
              '            print(f"Candidate generation finished in {generation_seconds:.2f}s.")\n'
              '    elif not args.json:\n',
              1,
          )
          frontend.write_text(text, encoding="utf-8")

          cli_tests = Path("tests/test_user_cli.py")
          text = cli_tests.read_text(encoding="utf-8")
          assertion_anchor = '        self.assertEqual(cmd[cmd.index("--min-zipf") + 1], "2.7")\n'
          if assertion_anchor not in text:
              raise SystemExit("CLI test anchor not found")
          text = text.replace(
              assertion_anchor,
              assertion_anchor + '        self.assertEqual(cmd[cmd.index("--workers") + 1], "0")\n',
              1,
          )
          cli_tests.write_text(text, encoding="utf-8")

          generator_tests = Path("tests/test_generator_parallel.py")
          generator_tests.write_text(r'''from __future__ import annotations

          import unittest
          from unittest.mock import patch

          import anagram_generate as generator


          def sig(a: int, b: int) -> tuple[int, ...]:
              return (a, b) + (0,) * 24


          class GeneratorParallelTests(unittest.TestCase):
              def setUp(self) -> None:
                  self.candidates = [
                      generator.Candidate("a", sig(1, 0), 1, 5.0),
                      generator.Candidate("b", sig(0, 1), 1, 5.0),
                      generator.Candidate("ab", sig(1, 1), 2, 5.0),
                  ]
                  self.remaining = sig(2, 2)

              def solve(self, *, workers: int, limit: int = 0, hints=()):
                  return list(
                      generator.solve(
                          self.remaining,
                          self.candidates,
                          2,
                          4,
                          limit,
                          allow_repeat=True,
                          workers=workers,
                          required_any=hints,
                      )
                  )

              def test_parallel_matches_sequential_order_and_results(self) -> None:
                  self.assertEqual(self.solve(workers=2), self.solve(workers=1))

              def test_parallel_preserves_bounded_prefix(self) -> None:
                  self.assertEqual(
                      self.solve(workers=2, limit=2),
                      self.solve(workers=1, limit=2),
                  )

              def test_hint_is_enforced_inside_search(self) -> None:
                  expected = [("ab", "ab"), ("a", "b", "ab")]
                  self.assertEqual(self.solve(workers=1, hints={"ab"}), expected)
                  self.assertEqual(self.solve(workers=2, hints={"ab"}), expected)

              def test_auto_worker_count_is_bounded(self) -> None:
                  with patch.object(generator.os, "cpu_count", return_value=16):
                      self.assertEqual(generator.resolve_worker_count(0), 8)
                  with patch.object(generator.os, "cpu_count", return_value=1):
                      self.assertEqual(generator.resolve_worker_count(0), 1)
                  self.assertEqual(generator.resolve_worker_count(3), 3)
          ''').replace("          ", ""), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          needle = "Normal use runs a balanced search capped at 100,000 generated word bags. This avoids silently turning every simple solve into an unlimited 2–6-word enumeration while still giving the reranker a large candidate population.\n"
          addition = needle + "\nCandidate generation uses multiple worker processes by default (up to 8, based on available CPUs). `--workers N` controls both generation and reranking. Hint words are also enforced during the exact search so branches that can no longer contain any hint are pruned early instead of being generated and discarded afterward.\n"
          if needle not in text:
              raise SystemExit("README performance anchor not found")
          readme.write_text(text.replace(needle, addition, 1), encoding="utf-8")
          PY

      - name: Validate patch
        run: |
          python -m py_compile anagram_generate.py anagram_solver.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit validated implementation
        run: |
