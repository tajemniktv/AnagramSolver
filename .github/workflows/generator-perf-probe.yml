name: generator performance probe

on:
  push:
    branches: [feature/user-friendly-cli]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Warm dictionary and unigram caches
        run: |
          python anagram_generate.py IAMTESTINGANAGRAMS \
            --min-word-len 2 --min-words 2 --max-words 2 \
            --min-zipf 2.7 --short-word-policy common \
            --max-results 1 --top-per-group 1 --export /tmp/warm.txt >/dev/null
      - name: Measure exact-search buckets
        shell: bash
        run: |
          set +e
          echo "CPU count: $(nproc)"
          measure() {
            label="$1"; minw="$2"; maxw="$3"
            echo "=== $label ($minw..$maxw words, cap 20k) ==="
            /usr/bin/time -f "WALL=%e USER=%U SYS=%S CPU=%P RSS=%MKB" \
              timeout 120s python anagram_generate.py IAMTESTINGANAGRAMS \
                --min-word-len 2 --min-words "$minw" --max-words "$maxw" \
                --min-zipf 2.7 --short-word-policy common \
                --max-results 20000 --top-per-group 1 \
                --export "/tmp/${label}.txt" >/dev/null
            code=$?
            echo "EXIT=$code"
            if [ -f "/tmp/${label}.txt" ]; then
              wc -l "/tmp/${label}.txt"
            fi
            echo
          }
          measure w2 2 2
          measure w3 3 3
          measure w4 4 4
          measure w5 5 5
          measure w6 6 6
          measure combined 2 6
          exit 0
