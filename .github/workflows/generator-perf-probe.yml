name: generator performance probe

on:
  push:
    branches: [feature/user-friendly-cli]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Warm dictionary and unigram caches
        run: |
          python anagram_generate.py IAMTESTINGANAGRAMS \
            --min-word-len 2 --min-words 2 --max-words 2 \
            --min-zipf 2.7 --short-word-policy common \
            --workers 1 --max-results 1 --top-per-group 1 \
            --export /tmp/warm.txt >/dev/null
      - name: Compare one worker with process parallelism
        shell: bash
        run: |
          set -e
          echo "CPU count: $(nproc)"
          measure() {
            label="$1"; workers="$2"; cap="$3"
            echo "=== $label: workers=$workers cap=$cap ==="
            /usr/bin/time -f "WALL=%e USER=%U SYS=%S CPU=%P RSS=%MKB" \
              timeout 180s python anagram_generate.py IAMTESTINGANAGRAMS \
                --min-word-len 2 --min-words 2 --max-words 6 \
                --min-zipf 2.7 --short-word-policy common \
                --workers "$workers" --max-results "$cap" --top-per-group 1 \
                --export "/tmp/${label}.txt" >/dev/null
            wc -l "/tmp/${label}.txt"
            echo
          }

          measure single20 1 20000
          measure parallel20 4 20000
          diff -q /tmp/single20.txt /tmp/parallel20.txt

          measure single100 1 100000
          measure parallel100 4 100000
          diff -q /tmp/single100.txt /tmp/parallel100.txt

          echo "=== hinted pruning smoke ==="
          /usr/bin/time -f "WALL=%e USER=%U SYS=%S CPU=%P RSS=%MKB" \
            timeout 120s python anagram_generate.py ODITIHNSLSHEEEPT \
              --min-word-len 2 --min-words 2 --max-words 6 \
              --min-zipf 3.0 --short-word-policy common \
              --contains-any dont --workers 4 --max-results 20000 \
              --top-per-group 1 --export /tmp/hinted.txt >/dev/null
          grep -qi "dont" /tmp/hinted.txt
