name: phrase corpus benchmarks

on:
  pull_request:
  schedule:
    # Refresh the default-branch corpus snapshot near the start of each month.
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phrase-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus-matrix:
    name: phrase ordering A/B or manual full corpus matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Choose monthly corpus snapshot cache key
        id: corpus-key
        shell: bash
        run: echo "month=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Restore project-local language data and phrase indexes
        id: corpus-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .anagram_data
            .ci_phrase_cache
          key: phrase-corpora-${{ runner.os }}-${{ steps.corpus-key.outputs.month }}-${{ hashFiles('phrase_index_schema.txt') }}
          restore-keys: |
            phrase-corpora-${{ runner.os }}-${{ steps.corpus-key.outputs.month }}-

      # Cache versions include their path list. During the migration away from
      # ~/.multi_anagram, a new-layout restore cannot see the existing ~1 GB
      # default-branch corpus cache even when the key prefix matches. On a new-
      # layout miss, restore that legacy cache with its historical path list,
      # copy its reusable data into .anagram_data, then remove the temporary
      # home-directory copy. The save step below publishes the new layout.
      - name: Restore legacy corpus cache for path migration
        id: legacy-corpus-cache
        if: steps.corpus-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.multi_anagram
            .ci_phrase_cache
          key: legacy-phrase-corpora-${{ runner.os }}-${{ steps.corpus-key.outputs.month }}
          restore-keys: |
            phrase-corpora-${{ runner.os }}-${{ steps.corpus-key.outputs.month }}-

      - name: Migrate legacy language-data path
        if: steps.legacy-corpus-cache.outputs.cache-matched-key != ''
        shell: bash
        run: |
          if [ -d "$HOME/.multi_anagram" ]; then
            mkdir -p .anagram_data
            cp -a "$HOME/.multi_anagram/." .anagram_data/
            rm -rf "$HOME/.multi_anagram"
          fi

      # Prepared rows depend on reranker feature code, while their on-disk key
      # intentionally uses an explicit schema rather than hashing source files.
      # Never inherit them across branches/PRs. Rebuilding them is cheap compared
      # with rebuilding the Wikimedia phrase indexes, and later scenarios in this
      # same job can still reuse the freshly prepared rows.
      - name: Drop code-sensitive prepared-feature cache
        shell: bash
        run: rm -rf .anagram_data/prepared_cache

      - name: Build Wiktionary phrase index
        shell: bash
        run: |
          mkdir -p .ci_phrase_cache
          if [ ! -s .ci_phrase_cache/wiktionary.db ]; then
            python build_wikimedia_phrase_index.py \
              --output .ci_phrase_cache/wiktionary.db \
              --rebuild
          else
            echo "Using cached Wiktionary phrase index"
          fi

      - name: Build Wiktionary + Wikipedia phrase index
        shell: bash
        run: |
          if [ ! -s .ci_phrase_cache/wiktionary-wikipedia.db ]; then
            python build_wikimedia_phrase_index.py \
              --include-wikipedia \
              --output .ci_phrase_cache/wiktionary-wikipedia.db \
              --rebuild
          else
            echo "Using cached Wiktionary + Wikipedia phrase index"
          fi

      # Pull requests keep only the cheap ordering A/B. This provides ranking
      # regression signal without repeatedly running exact-anagram generation.
      - name: Run fast PR phrase-order matrix
        if: github.event_name == 'pull_request'
        run: |
          python ci_phrase_matrix.py \
            --wiktionary-db .ci_phrase_cache/wiktionary.db \
            --wikipedia-db .ci_phrase_cache/wiktionary-wikipedia.db \
            --workers 8 \
            --order-only

      # Full generation + reranking is intentionally explicit. A normal merge to
      # main does not launch it; use the Run workflow button when an end-to-end
      # corpus comparison is actually useful.
      - name: Run manual full corpus benchmark matrix
        if: github.event_name == 'workflow_dispatch'
        run: |
          python ci_phrase_matrix.py \
            --wiktionary-db .ci_phrase_cache/wiktionary.db \
            --wikipedia-db .ci_phrase_cache/wiktionary-wikipedia.db \
            --workers 8

      # Scheduled runs exist only to seed the new monthly corpus cache on the
      # default branch so future PRs can restore it. No benchmark is run here.
      - name: Monthly corpus cache refresh only
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ steps.corpus-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Monthly project-local corpus cache is already warm; no benchmark requested."
          else
            echo "Monthly project-local corpus cache was populated/rebuilt and will be saved; no benchmark requested."
          fi

      - name: Save project-local language data and phrase indexes
        if: success() && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .anagram_data
            .ci_phrase_cache
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}
