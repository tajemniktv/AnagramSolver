name: apply parallel generator integration

on:
  push:
    branches: [feature/user-friendly-cli]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/user-friendly-cli
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Apply integration patch
        run: python tools_apply_generator_parallel.py
      - name: Validate implementation
        run: |
          python -m py_compile anagram_search_parallel.py anagram_generate.py anagram_solver.py anagram_benchmark.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit validated implementation
        run: |
          rm tools_apply_generator_parallel.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anagram_search_parallel.py anagram_generate.py anagram_solver.py anagram_benchmark.py README.md tests/test_user_cli.py tests/test_generator_parallel.py tools_apply_generator_parallel.py
          git commit -m "Parallelize exact candidate generation"
          git push origin HEAD:feature/user-friendly-cli
