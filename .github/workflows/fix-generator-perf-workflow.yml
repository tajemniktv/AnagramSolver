name: fix staged generator performance patcher

on:
  push:
    branches: [feature/user-friendly-cli]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/user-friendly-cli
          persist-credentials: true
      - name: Fix patch script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-generator-perf.yml')
          text = path.read_text(encoding='utf-8')
          old = "''').replace(\"          \", \"\"), encoding=\"utf-8\")"
          new = "'''.replace(\"          \", \"\"), encoding=\"utf-8\")"
          if old not in text:
              raise SystemExit('broken syntax pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-generator-perf-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-generator-perf.yml .github/workflows/fix-generator-perf-workflow.yml
          git commit -m "Fix generator performance patch staging"
          git push origin HEAD:feature/user-friendly-cli
