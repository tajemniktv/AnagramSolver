name: apply phrase benchmark review fixes

on:
  push:
    branches: [feature/phrase-benchmarking]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/phrase-benchmarking
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Apply review fixes
        run: python scripts/apply_review_fixes.py
      - name: Validate
        run: |
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anagram_benchmark.py tests/test_phrase_benchmarking.py
          git commit -m "Fix phrase benchmark A/B review findings"
          git push
