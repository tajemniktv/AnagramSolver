name: apply review fixes

on:
  push:
    branches:
      - cleanup/remove-versioned-names

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Apply fixes
        run: python scripts/apply_review_fixes.py
      - name: Validate
        run: |
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "Grzegorz Kaczmarski"
          git config user.email "tajemniktv@outlook.com"
          git add anagram_rerank.py anagram_rerank_core.py anagram_rerank_topk_impl.py anagram_benchmark.py tests/test_review_fixes.py
          git commit -m "Address post-cleanup review findings"
          git push
