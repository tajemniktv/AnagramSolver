name: apply sequential search optimization

on:
  push:
    branches: [feature/user-friendly-cli]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/user-friendly-cli
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Restore historical DFS and optimize its hot loop
        shell: bash
        run: |
          git checkout 3466847bee57eb2e6b8602f4600d4334efac11a1 -- \
            README.md anagram_benchmark.py anagram_generate.py anagram_solver.py tests/test_user_cli.py
          rm -f anagram_search_parallel.py tests/test_generator_parallel.py
          python - <<'PY'
          from pathlib import Path

          path = Path("anagram_generate.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import sys\nimport unicodedata\n", "import sys\nimport time\nimport unicodedata\n", 1)

          old = """    results_found = 0
              dead: set[tuple[tuple[int, ...], int, int]] = set()
              min_candidate_len = min(c.length for c in candidates)
              max_candidate_len = max(c.length for c in candidates)

              def dfs(
                  rem: tuple[int, ...],
                  start: int,
                  words_left: int,
                  chosen: list[str],
              ) -> Iterator[tuple[str, ...]]:
                  nonlocal results_found

                  if max_results > 0 and results_found >= max_results:
                      return

                  rem_len = sum(rem)
          """.replace("              ", "")
          new = """    results_found = 0
              dead: set[tuple[tuple[int, ...], int, int]] = set()
              min_candidate_len = min(c.length for c in candidates)
              max_candidate_len = max(c.length for c in candidates)
              sparse_signatures = [
                  tuple((letter, amount) for letter, amount in enumerate(c.sig) if amount)
                  for c in candidates
              ]

              def dfs(
                  rem: tuple[int, ...],
                  rem_len: int,
                  start: int,
                  words_left: int,
                  chosen: list[str],
              ) -> Iterator[tuple[str, ...]]:
                  nonlocal results_found

                  if max_results > 0 and results_found >= max_results:
                      return
          """.replace("              ", "")
          if old not in text:
              raise SystemExit("DFS setup anchor not found")
          text = text.replace(old, new, 1)

          old = """            if not fits(c.sig, rem):
                      continue
                  new_rem = tuple(r - w for r, w in zip(rem, c.sig))
                  next_start = i if allow_repeat else i + 1
                  yield from dfs(new_rem, next_start, words_left - 1, chosen + [c.word])
          """.replace("              ", "")
          new = """            sparse = sparse_signatures[i]
                  candidate_fits = True
                  for letter, amount in sparse:
                      if rem[letter] < amount:
                          candidate_fits = False
                          break
                  if not candidate_fits:
                      continue
                  mutable_rem = list(rem)
                  for letter, amount in sparse:
                      mutable_rem[letter] -= amount
                  new_rem = tuple(mutable_rem)
                  next_start = i if allow_repeat else i + 1
                  yield from dfs(
                      new_rem,
                      rem_len - c.length,
                      next_start,
                      words_left - 1,
                      chosen + [c.word],
                  )
          """.replace("              ", "")
          if old not in text:
              raise SystemExit("DFS hot-loop anchor not found")
          text = text.replace(old, new, 1)

          old = """    for nwords in range(min_words, max_words + 1):
                  yield from dfs(remaining, 0, nwords, [])
          """.replace("              ", "")
          new = """    initial_remaining_len = sum(remaining)
              for nwords in range(min_words, max_words + 1):
                  yield from dfs(remaining, initial_remaining_len, 0, nwords, [])
          """.replace("              ", "")
          if old not in text:
              raise SystemExit("DFS root-call anchor not found")
          text = text.replace(old, new, 1)

          old = """    solutions: list[tuple[str, ...]] = []
              generated = 0
              accepted = 0
              try:
          """.replace("              ", "")
          new = """    solutions: list[tuple[str, ...]] = []
              generated = 0
              accepted = 0
              search_started = time.perf_counter()
              try:
          """.replace("              ", "")
          if old not in text:
              raise SystemExit("search timing start anchor not found")
          text = text.replace(old, new, 1)

          old = """    print(
                  f"Generated {generated:,} exact word set(s); "
                  f"{accepted:,} survived clue constraints.",
                  file=sys.stderr,
              )
          """.replace("              ", "")
          new = """    search_seconds = time.perf_counter() - search_started
              print(
                  f"Generated {generated:,} exact word set(s); "
                  f"{accepted:,} survived clue constraints. "
                  f"Exact search: {search_seconds:.2f}s.",
                  file=sys.stderr,
              )
          """.replace("              ", "")
          if old not in text:
              raise SystemExit("search timing summary anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          Path("tests/test_generator_search_optimization.py").write_text('''from __future__ import annotations

          import unittest

          import anagram_generate as generator


          def sig(a=0, b=0, c=0):
              return (a, b, c) + (0,) * 23


          class SearchOptimizationTests(unittest.TestCase):
              def test_historical_exhaustive_order_is_preserved(self) -> None:
                  candidates = [
                      generator.Candidate("ab", sig(1, 1), 2, 5.0),
                      generator.Candidate("ac", sig(1, 0, 1), 2, 4.9),
                      generator.Candidate("bc", sig(0, 1, 1), 2, 4.8),
                      generator.Candidate("abc", sig(1, 1, 1), 3, 4.7),
                  ]
                  remaining = sig(2, 2, 2)
                  self.assertEqual(
                      list(generator.solve(remaining, candidates, 2, 3, 0, True)),
                      [("abc", "abc"), ("ab", "ac", "bc")],
                  )
                  self.assertEqual(
                      list(generator.solve(remaining, candidates, 2, 3, 0, False)),
                      [("ab", "ac", "bc")],
                  )

              def test_historical_bounded_prefix_is_preserved(self) -> None:
                  candidates = [
                      generator.Candidate("a", sig(1), 1, 5.0),
                      generator.Candidate("b", sig(0, 1), 1, 4.9),
                      generator.Candidate("ab", sig(1, 1), 2, 4.8),
                  ]
                  remaining = sig(2, 2)
                  expected = [("ab", "ab"), ("a", "b", "ab"), ("a", "a", "b", "b")]
                  observed = list(generator.solve(remaining, candidates, 2, 4, 0, True))
                  self.assertEqual(observed, expected)
                  for limit in (1, 2, 3):
                      with self.subTest(limit=limit):
                          self.assertEqual(
                              list(generator.solve(remaining, candidates, 2, 4, limit, True)),
                              expected[:limit],
                          )
          '''.replace("          ", ""), encoding="utf-8")
          PY
      - name: Validate optimized sequential search
        run: |
          python -m py_compile anagram_generate.py anagram_solver.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md anagram_benchmark.py anagram_generate.py anagram_solver.py anagram_search_parallel.py tests/test_user_cli.py tests/test_generator_parallel.py tests/test_generator_search_optimization.py
          git commit -m "Optimize exact candidate DFS"
          git push origin HEAD:feature/user-friendly-cli
