name: apply sequential search optimization

on:
  push:
    branches: [feature/user-friendly-cli]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/user-friendly-cli
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Restore historical DFS and apply optimization
        run: |
          git checkout 3466847bee57eb2e6b8602f4600d4334efac11a1 -- \
            README.md anagram_benchmark.py anagram_generate.py anagram_solver.py tests/test_user_cli.py
          rm -f anagram_search_parallel.py tests/test_generator_parallel.py
          python tools_optimize_seq.py
      - name: Validate optimized sequential search
        run: |
          python -m py_compile anagram_generate.py anagram_solver.py tools_optimize_seq.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit validated implementation
        run: |
          rm tools_optimize_seq.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md anagram_benchmark.py anagram_generate.py anagram_solver.py anagram_search_parallel.py tests/test_user_cli.py tests/test_generator_parallel.py tests/test_generator_search_optimization.py tools_optimize_seq.py
          git commit -m "Optimize exact candidate DFS"
          git push origin HEAD:feature/user-friendly-cli
