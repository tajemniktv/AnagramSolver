name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ordering-layer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.multi_anagram/wordnet31
          key: wordnet31-${{ runner.os }}-${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run ordering regression suite
        run: python anagram_benchmark.py --mode order
