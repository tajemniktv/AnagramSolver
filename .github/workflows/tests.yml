name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Ruff and Pyright
        run: python -m pip install --disable-pip-version-check ruff==0.16.3 pyright==1.1.411
      - name: Enforce reported Ruff diagnostics
        run: >-
          ruff check
          --select F821,F401,F841,I001,UP035,UP037,RUF007,PIE808,PERF102,SIM102,SIM114,FURB192,RUF059,C408,C409,PLW1510,RUF010,FURB167,FURB105,RUF100,BLE001,B010
          anagram_paths.py anagram_benchmark.py anagram_generate.py anagram_user_generate.py anagram_user_lexicon.py anagram_user_search.py
          anagram_rerank.py anagram_rerank_core.py anagram_rerank_topk_impl.py anagram_solver.py anagram_performance.py anagram_corpus_cohesion.py
          anagram_feature_ranker.py anagram_order_diversity.py anagram_order_refinement.py train_feature_ranker.py build_wikimedia_phrase_index.py
          ci_phrase_matrix.py ci_ordering_gate.py ci_performance_probe.py ci_order_refinement.py ci_user_runs.py ci_user_search_probe.py
      - name: Enforce Pylance/Pyright diagnostics
        run: >-
          pyright anagram_paths.py anagram_generate.py anagram_user_generate.py anagram_user_lexicon.py anagram_user_search.py
          anagram_rerank_core.py anagram_rerank.py anagram_rerank_topk_impl.py anagram_solver.py
          anagram_performance.py anagram_corpus_cohesion.py anagram_feature_ranker.py anagram_order_diversity.py
          anagram_order_refinement.py train_feature_ranker.py ci_ordering_gate.py ci_performance_probe.py
          ci_order_refinement.py ci_user_runs.py ci_user_search_probe.py

  unit-tests:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  normal-user-cli:
    name: normal user CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .anagram_data/wordnet31
            .anagram_data/dictionary
            .anagram_data/ngrams
          key: normal-user-corpora-${{ runner.os }}-v2-${{ hashFiles('anagram_user_lexicon.py', 'anagram_generate.py') }}
      - name: Provision runtime corpora outside smoke timeouts
        run: |
          python - <<'PY'
          from pathlib import Path
          import anagram_generate as g
          import anagram_rerank_core as r
          import anagram_user_lexicon as u

          print(g.get_dictionary(g.DEFAULT_DICT_URL))
          one, two = g.ensure_ngram_data(Path(g.DEFAULT_NGRAM_DIR), refresh=False, need_bigrams=True)
          print(one)
          print(two)
          print(r.ensure_wordnet(r.DEFAULT_WORDNET_DIR))
          print(u.ensure_user_lexicon())
          PY
      - name: Probe known holdout beam path
        run: python ci_user_search_probe.py
      - name: Clear puzzle-specific caches
        run: rm -rf .anagram_data/prepared_cache .anagram_data/solver_runs
      - name: Run ordinary verbose user invocations
        run: python ci_user_runs.py

  ordering-regression:
    name: ordering regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .anagram_data/wordnet31
          key: wordnet31-${{ runner.os }}
      - name: Provision WordNet
        run: python -c "import anagram_rerank_core as c; print(c.ensure_wordnet(c.DEFAULT_WORDNET_DIR))"
      - name: Enforce ordering regression thresholds
        run: python ci_ordering_gate.py
      - name: Report forced-beam k-opt refinement A/B
        run: python ci_order_refinement.py
