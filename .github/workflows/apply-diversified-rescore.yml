name: apply diversified phrase rescore

on:
  push:
    branches:
      - feature/diversified-phrase-rescore

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: feature/diversified-phrase-rescore
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Apply implementation patch
        run: python .github/scripts/apply_diversified_rescore.py
      - name: Compile
        run: python -m py_compile *.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Diff check
        run: git diff --check
      - name: Commit validated changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-diversified-rescore.yml
          rm -f .github/scripts/apply_diversified_rescore.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diversify phrase rescore candidate admission"
          git push origin HEAD:feature/diversified-phrase-rescore
