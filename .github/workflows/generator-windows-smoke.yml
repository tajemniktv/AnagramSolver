name: generator Windows smoke

on:
  push:
    branches: [feature/user-friendly-cli]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Parallel search unit tests
        run: python -m unittest tests.test_generator_parallel -v
      - name: Spawn multiprocessing generator smoke
        shell: pwsh
        run: |
          python anagram_generate.py IAMTESTINGANAGRAMS `
            --min-word-len 2 --min-words 2 --max-words 6 `
            --min-zipf 2.7 --short-word-policy common `
            --workers 2 --max-results 500 `
            --top-per-group 1 --export "$env:RUNNER_TEMP\candidates.txt"
          if (-not (Test-Path "$env:RUNNER_TEMP\candidates.txt")) { throw "candidate export missing" }
